<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的第一个网页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2329;
      background: #f7f8fa;
      line-height: 1.6;
    }
    /* 顶部导航 */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: #ffffff;
      border-bottom: 1px solid #ececec;
    }
    .nav .logo { font-weight: 600; font-size: 18px; }
    .nav .menu a {
      margin-left: 24px;
      color: #5f5e5a;
      text-decoration: none;
      font-size: 14px;
    }
    .nav .menu a:hover { color: #185fa5; }

    /* 主视觉 */
    .hero {
      text-align: center;
      padding: 80px 24px 64px;
      background: #ffffff;
    }
    .hero h1 { font-size: 36px; font-weight: 600; margin-bottom: 16px; }
    .hero p { font-size: 16px; color: #5f5e5a; max-width: 560px; margin: 0 auto 28px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #185fa5;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
    }

    /* 卡片区 */
    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 56px 24px;
      max-width: 960px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border: 1px solid #ececec;
      border-radius: 12px;
      padding: 24px;
      width: 280px;
    }
    .card h3 { font-size: 16px; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #5f5e5a; }

    /* 页脚 */
    .footer {
      text-align: center;
      padding: 28px;
      color: #888780;
      font-size: 13px;
      background: #ffffff;
      border-top: 1px solid #ececec;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">我的网站</div>
    <div class="menu">
      <a href="#about">关于</a>
      <a href="#features">功能</a>
      <a href="#contact">联系</a>
    </div>
  </nav>

  <header class="hero">
    <h1>你好，这是我的第一个网页</h1>
    <p>网页就是由 HTML（结构）、CSS（样式）、JS（交互）组成的文件。改改文字和颜色，它就是你的了。</p>
    <a class="btn" href="#features">看看能做什么</a>
  </header>

  <section class="cards" id="features">
    <div class="card">
      <h3>展示内容</h3>
      <p>放文字、图片、视频，做一个个人主页或产品介绍页。</p>
    </div>
    <div class="card">
      <h3>交互功能</h3>
      <p>用 JavaScript 实现按钮、表单、动态数据等互动效果。</p>
    </div>
    <div class="card">
      <h3>随时访问</h3>
      <p>部署上线后，任何人输入网址就能打开，无需安装。</p>
    </div>
  </section>

  <footer class="footer" id="contact">
    © 2026 我的第一个网页 · 由 WorkBuddy 生成示例
  </footer>
</body>
</html>
