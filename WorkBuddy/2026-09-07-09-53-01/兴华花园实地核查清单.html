<body data-page-node-id="Iilf3BJBm18YgTbJttZuMJ">
  <h1 data-page-node-id="lEIxzqH1RxDMG8HB3wmKs5">兴华花园 · 实地核查清单</h1>
  <div class="sub" data-page-node-id="LFAHYWBYyN51m7dFPCIv6y">万坨专用 · 卧室夜间 ≤35–40dB 红线 · 红本70年住宅</div>

  <div class="warn" data-page-node-id="ZoiPu2IYE1BJ6FfRQ1NSL0">
    <b data-page-node-id="Ncjl02hpG706NpL0z5maal">⚠️ 最关键一条：白天测不准夜间噪音。</b><br data-page-node-id="96rsDVpAJqBBj7ACVcsJvx">
    现在白天看只能查位置/电梯/户型/红本。你红线是"夜间卧室≤35–40dB"，必须<b data-page-node-id="wbYQEwWUAz0XXj45uxsVA3">晚10:30后带分贝仪回来复测</b>，读数≤40dB 才算过关。今天先看，今晚或改天夜里再测一次。
  </div>

  <div class="card" data-page-node-id="Dm7e7GEsecRjOIPG1OLLBG">
    <h2 data-page-node-id="Cxmnz6112tpvj2auB6IzMP">① 红本核验（签约前必查）</h2>
    <label data-page-node-id="SrRxRgLkkERu6TnVWitqwq"><input type="checkbox" data-page-node-id="5Jgkz4QfAhxwD13Lpc5Uir"><span data-page-node-id="MeqYo2FJZiK5khwPgaiYGR">
      <span class="how" data-page-node-id="zTCf2NOTKJa7DsI83MEsFB">让中介出示<b data-page-node-id="C7pNrbH4bYUjCSdt9AZ4vI">不动产权证复印件</b>，只看两项：<br data-page-node-id="WjRFPeyAg5akyIVWfTlmvO">
      用途 = 住宅（城镇住宅用地）／ 年限 = 70年</span><br data-page-node-id="G3mrtGIXw4HbvIA8bwWLlG">
      <span class="pass" data-page-node-id="xH4dDgLE1wR7jYRqrWk3vN">过关：两项都对，才是真红本，能贷能落户</span>
    </span></label>
    <label data-page-node-id="IQKDie4vNsWD365yPOzvDB"><input type="checkbox" data-page-node-id="lVDozApWRtqukIWLrrGusV"><span data-page-node-id="OrGEkPkU5Ai5oZyonWyNsc">
      <span class="how" data-page-node-id="eJ0Tymu7FzA7rAOZugm2z3">凡只有"村委合同／律师见证／两证一书／历史遗留回执"的，一律不是红本</span><br data-page-node-id="LGpGNeE2yvXvZLYj93MODy">
      <span class="pass" data-page-node-id="ouyn8yPBNBfR55dEUvxxAZ">过关：无此类文件才算干净</span>
    </span></label>
    <label data-page-node-id="LJFBtVMMLi9I4ZMyA8pH9R"><input type="checkbox" data-page-node-id="CNMtHkuJduPkBfSxWjtPqy"><span data-page-node-id="MC9HuzDhb8TUDrW0rocEAt">
      <span class="how" data-page-node-id="pRykDvKeSOqHBHiYgv7S8E">确认是"普通住宅"不是"商务/产业公寓"（后者不能落户、首付5成贷10年、商用水电）</span>
    </span></label>
  </div>

  <div class="card" data-page-node-id="i2QGIBr1jixRJzyRkVOn19">
    <h2 data-page-node-id="LCvsdGKggkP6QYtVfH4UiJ">② 楼栋与电梯（中介说已加梯）</h2>
    <label data-page-node-id="wnEgw4JGNGz9DAP5B8cPLV"><input type="checkbox" data-page-node-id="sU0BCNYFMVjPj8GyDd640K"><span data-page-node-id="WuHeuK8cTLVEtl8U8vFvrG">
      <span class="how" data-page-node-id="rHkSP4CBDUjV67g0eRw2Fa">看外立面有无<b data-page-node-id="AKe91MDiBOppnzcSkbeWOS">外挂钢结构电梯井</b>（已加完的楼一眼能认）</span>
    </span></label>
    <label data-page-node-id="V0cGAA4JLkceJeU3NRKWqI"><input type="checkbox" data-page-node-id="5PiOTlCoRG6BFdp2YgvmSO"><span data-page-node-id="Jy4yfGbocWkw4kWOnrk4LS">
      <span class="how" data-page-node-id="uWfG5yyTnKvOapR1Mw8r8Y">让中介带你<b data-page-node-id="p61Gc6i8kMbQZMrw1zbRUP">现场乘一次梯</b>，确认你看的那套所在楼栋电梯已完工可用，不是"在装"</span><br data-page-node-id="L1t8KW4HUtA6sJDQp0nFpr">
      <span class="pass" data-page-node-id="3A0rRA6ItrNcmhQKXOrKHN">过关：能实际乘坐到你所看楼层</span>
    </span></label>
    <label data-page-node-id="OueArw8PKplWboj0qsF6aG"><input type="checkbox" data-page-node-id="GdcBfDb20tM7wfNkwktRH4"><span data-page-node-id="Ya4OBYABuGiWDKswE0Rfwm">
      <span class="how" data-page-node-id="oTBioCRNO0vIbZJXX5o4iO">问物业/业委会：小区9栋里到底哪几栋加完了？你那套在第几栋？</span>
    </span></label>
  </div>

  <div class="card" data-page-node-id="05CAcXOyiRgLH42aWHSljE">
    <h2 data-page-node-id="eMWI8Q10pZeeehAC5U1p0y">③ 位置与噪音（你的硬红线）</h2>
    <label data-page-node-id="3A2g3DCsZiOE8qCnqkuBFK"><input type="checkbox" data-page-node-id="ZfUhC9Hvq2L84FHAWwsi2H"><span data-page-node-id="HS7xGwcEbpWhthJZGmtzF2">
      <span class="how" data-page-node-id="jssSopqPRgaE8QOYxhxlAZ">站在你那套<b data-page-node-id="BJTnaD6dCWjUv4fKGOhAws">卧室窗外</b>，目测/手机测距：离宝安大道、西乡大道、107国道各多远？中间有无前排楼遮挡？</span><br data-page-node-id="iYb1KEojWSYRmzOtGsyYAi">
      <span class="pass" data-page-node-id="cNGPe78V0yEls7ENAtBlQH">过关：内围、背向大道、有遮挡，离路越远越好</span>
    </span></label>
    <label data-page-node-id="v04DhuC1CHhisfbML60y6w"><input type="checkbox" data-page-node-id="vIUV97E8GJpfSNo45BZhns"><span data-page-node-id="b7jAuzheiPFMPVU9XSaZjj">
      <span class="how" data-page-node-id="s1lmMZji20gSpp1fJj4Ecz">卧室朝向是否正对马路？临路一排直接出局</span>
    </span></label>
    <label data-page-node-id="yBRe7u7Vy9kOIX53db2UfJ"><input type="checkbox" data-page-node-id="HGF2rGsT5h1fOdGAPpYURM"><span data-page-node-id="T4BQiciGiOIPeBLYA4LPVh">
      <span class="how" data-page-node-id="RBYU7LcR426qkDfllQCjv7"><b data-page-node-id="KhYE1323A0I6zyM25anL4U">白天粗测</b>：手机分贝仪App关窗测一次，记下来（白天车流大，数值会偏高，仅作参考）</span>
    </span></label>
    <label data-page-node-id="ZLYsKzgMEGTNzyYGXHwtVO"><input type="checkbox" data-page-node-id="RAuekStdWtsNow5SPT1sXv"><span data-page-node-id="fFS9TAK49B529hC1Vv4ke1">
      <span class="how" data-page-node-id="LHsulLR732elsKFQalGFmv"><b data-page-node-id="iuyjvoR8lp6nvmP85AidEn">夜间复测（必做）</b>：晚10:30后带分贝仪，卧室关窗测，读数 ≤40dB 才算过你红线</span><br data-page-node-id="7Uqat4QDcx1isahYrAtTeE">
      <span class="pass" data-page-node-id="MzU32aa0nHLtl4gLkeDiSt">过关：夜间 ≤40dB（理想 ≤35dB）</span>
    </span></label>
  </div>

  <div class="card" data-page-node-id="C0tio0OHV66p0fAPLNa8SP">
    <h2 data-page-node-id="7Sn3COCtkFMMbd8HICIPLz">④ 户型与真实面积</h2>
    <label data-page-node-id="6FSEVNixhmaWLz1rkRceEE"><input type="checkbox" data-page-node-id="mBsuR1SFs4fwrC2AHW2phO"><span data-page-node-id="9cm4Fe6p0EhEEhJjshZvNO">
      <span class="how" data-page-node-id="B1k6OcbCU4bYwQXQh5XMhu">核对<b data-page-node-id="S54iytWtUYhFjvFPYp2ESE">建筑面积</b>（产证为准），不是"使用面积"或改造后的叫法</span>
    </span></label>
    <label data-page-node-id="7EgyELeuxz7DKJrcl1FomE"><input type="checkbox" data-page-node-id="ZDucTCrjicmEDwvHHhaFwT"><span data-page-node-id="j561NnNrSQjcFIW7vWIdzR">
      <span class="how" data-page-node-id="O4hAFRNuE5TmwyuVBvuFLB">现场看格局：厨卫是否独立设计（红本原始户型），还是后期隔断/复式改造？</span><br data-page-node-id="hWkFO1v2ldXredhel7IPhK">
      <span class="pass" data-page-node-id="HCiKCV90sv8FE2811IFlHB">过关：开发商原始一房/小两房，独立厨卫</span>
    </span></label>
    <label data-page-node-id="a1mYxcVHen1j7vldEGb0pi"><input type="checkbox" data-page-node-id="AZEWUoqBj5BBljonwhp6ky"><span data-page-node-id="izlisSvDhqmcHTIwfnDKeI">
      <span class="how" data-page-node-id="bHtUz0Rwi3C9GLE7JNf4OO">全拆重装可行性：承重墙位置、管道走向、能否做隔音窗（窗洞尺寸）</span>
    </span></label>
  </div>

  <div class="card" data-page-node-id="oJAUPwFkHFppcNV3G7F0cS">
    <h2 data-page-node-id="hIJ9b6IknZN8M8P2iIsYJO">⑤ 住户与安全（单身女性重点）</h2>
    <label data-page-node-id="fKrC8XXZdnwCKV7I7gKOKe"><input type="checkbox" data-page-node-id="j0uKaZtDmpCm7w7zdNT4SX"><span data-page-node-id="mi06lW1EJGZrpXKcFcTq9c">
      <span class="how" data-page-node-id="qF1fOPCd6Uyy9GlwhdAlsn">门口站 10–15 分钟，看进出人群：以白领/老居民为主，还是杂乱租客？</span>
    </span></label>
    <label data-page-node-id="eb4AglVjIPzFUaH55gpo3Y"><input type="checkbox" data-page-node-id="zwNOKWL5AHcWr2oYEi0juB"><span data-page-node-id="ERxh9KNZOQUD8Yqf5vxC3Q">
      <span class="how" data-page-node-id="fltwnL8QPvHQoJBDGItDms">看门卫管控：是否刷卡、有无保安站岗、外来人员是否登记</span><br data-page-node-id="cRzw3vl5LHg4CUH6BzqizO">
      <span class="pass" data-page-node-id="FwTiQzIVVJ0P3Z3XaPacsb">过关：半开放但门禁严、有保安</span>
    </span></label>
    <label data-page-node-id="7V7bZ3yxwHAcj4xIzPMEEt"><input type="checkbox" data-page-node-id="a8ZHycTAAZXgAMqjnHunnd"><span data-page-node-id="YwyGxKQtOUJNEu7rkbxidb">
      <span class="how" data-page-node-id="H8AE9oAEQ15OuKDUXxx24q">看楼道/电梯间卫生、有无杂物堆积、照明是否正常</span>
    </span></label>
    <label data-page-node-id="C8tIi0zY0cyxNPiOPioQAS"><input type="checkbox" data-page-node-id="yqOXNOgXWzIXufFoB3cMij"><span data-page-node-id="WJxPXMDrJO3gxffDXRxBym">
      <span class="how" data-page-node-id="Lcf0RBd5nMvrx39lwSSXNx">顺嘴问门卫/快递柜：小区租户多不多、晚上安不安静</span>
    </span></label>
  </div>

  <div class="foot" data-page-node-id="4DG2UrEaGqPHI24cWvZtSM">阿铁生成 · 2026-09-07 · 现场对照打勾，晚上记得带分贝仪复测</div>
