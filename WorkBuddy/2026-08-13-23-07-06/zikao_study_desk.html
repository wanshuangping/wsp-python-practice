<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自考学习台 - 计算机科学与技术本科</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4F46E5;--primary-light:#EEF2FF;--primary-dark:#3730A3;--red:#EF4444;--red-light:#FEF2F2;--green:#10B981;--green-light:#ECFDF5;--orange:#F59E0B;--orange-light:#FFFBEB;--gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;--gray-900:#111827;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--gray-50);color:var(--gray-800);line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:960px;margin:0 auto;padding:16px}
@media(min-width:768px){.app{padding:24px}}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{width:36px;height:36px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-logo svg{width:20px;height:20px;color:#fff}
.header-title{font-size:18px;font-weight:700;color:var(--gray-900)}
.header-sub{font-size:12px;color:var(--gray-500);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.sync-badge{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.sync-badge.online{background:var(--green-light);color:var(--green)}
.sync-badge.offline{background:var(--red-light);color:var(--red)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.btn-icon{width:36px;height:36px;border:1px solid var(--gray-200);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.btn-icon:hover{border-color:var(--primary);color:var(--primary)}
.btn-icon svg{width:16px;height:16px}

/* Countdown */
.countdown-bar{background:linear-gradient(135deg,var(--primary),#7C3AED);border-radius:var(--radius);padding:16px 20px;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.countdown-left{display:flex;align-items:center;gap:12px}
.countdown-num{font-size:32px;font-weight:800;line-height:1}
.countdown-label{font-size:13px;opacity:.9}
.countdown-right{font-size:12px;opacity:.85;text-align:right}

/* Today section */
.section{margin-bottom:20px}
.section-title{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.section-title .badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--red);color:#fff}
.today-list{display:flex;flex-direction:column;gap:8px}
.today-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--gray-200);box-shadow:var(--shadow)}
.today-item.overdue{border-color:var(--red);background:var(--red-light)}
.today-item-tag{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap}
.today-item-tag.overdue{background:var(--red);color:#fff}
.today-item-tag.today{background:var(--primary);color:#fff}
.today-item-tag.soon{background:var(--orange);color:#fff}
.today-item-content{flex:1;min-width:0}
.today-item-title{font-size:14px;font-weight:600;color:var(--gray-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-item-sub{font-size:12px;color:var(--gray-500)}
.today-item-btn{padding:6px 12px;border-radius:6px;border:none;background:var(--primary);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.today-item-btn:hover{background:var(--primary-dark)}

/* Tabs */
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:4px;margin-bottom:16px}
.tab{flex:1;padding:10px 12px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:600;color:var(--gray-500);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.active{background:var(--primary);color:#fff}
.tab svg{width:14px;height:14px}

/* Tab content */
.tab-content{display:none}
.tab-content.active{display:block}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:24px;font-weight:800;color:var(--primary)}
.stat-label{font-size:11px;color:var(--gray-500);margin-top:2px}

/* Record card */
.record-list{display:flex;flex-direction:column;gap:10px}
.record-card{background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:14px;box-shadow:var(--shadow);position:relative}
.record-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.record-card-title{font-size:14px;font-weight:600;color:var(--gray-900);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.record-card-tags{display:flex;gap:4px;flex-shrink:0}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tag-p0{background:var(--red-light);color:var(--red)}
.tag-p1{background:var(--orange-light);color:var(--orange)}
.tag-p2{background:var(--gray-100);color:var(--gray-500)}
.tag-progress{background:var(--primary-light);color:var(--primary)}
.tag-done{background:var(--green-light);color:var(--green)}
.tag-review{background:var(--red-light);color:var(--red)}
.tag-notstart{background:var(--gray-100);color:var(--gray-500)}
.record-card-body{display:flex;gap:12px;align-items:center}
.record-info{flex:1;min-width:0}
.record-subject{font-size:13px;color:var(--gray-600);font-weight:500;margin-bottom:4px}
.record-details{font-size:12px;color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.record-meta{display:flex;gap:12px;font-size:11px;color:var(--gray-400);margin-top:6px;flex-wrap:wrap}
.record-meta span{display:flex;align-items:center;gap:3px}
.record-actions{display:flex;gap:6px;flex-shrink:0}
.btn-small{padding:4px 10px;border-radius:6px;border:1px solid var(--gray-200);background:#fff;font-size:12px;font-weight:500;color:var(--gray-600);cursor:pointer;transition:all .15s}
.btn-small:hover{border-color:var(--primary);color:var(--primary)}
.btn-small.danger:hover{border-color:var(--red);color:var(--red)}

/* Progress ring */
.progress-ring{width:48px;height:48px;flex-shrink:0;position:relative}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring-bg{stroke:var(--gray-200)}
.progress-ring-fg{stroke:var(--primary);transition:stroke-dashoffset .3s}
.progress-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:var(--gray-700)}

/* Add button */
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border:2px dashed var(--gray-300);border-radius:10px;background:transparent;font-size:14px;font-weight:600;color:var(--gray-500);cursor:pointer;transition:all .15s;margin-bottom:12px}
.btn-add:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn-add svg{width:16px;height:16px}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;padding:20px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:30px;height:30px;border:none;background:var(--gray-100);border-radius:8px;cursor:pointer;font-size:18px;color:var(--gray-500);display:flex;align-items:center;justify-content:center}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-label{font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:4px;display:block}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--gray-300);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--gray-800);transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:10px;margin-top:18px}
.btn-primary{flex:1;padding:12px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{padding:12px 20px;border:1px solid var(--gray-300);border-radius:8px;background:#fff;font-size:14px;font-weight:500;color:var(--gray-600);cursor:pointer}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--gray-400)}
.empty svg{width:48px;height:48px;margin-bottom:8px;opacity:.4}
.empty p{font-size:14px}

/* Checkin matrix */
.checkin-stats{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.checkin-stat{background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
.checkin-stat-num{font-size:20px;font-weight:700;color:var(--primary)}
.checkin-stat-label{font-size:11px;color:var(--gray-500)}
.checkin-list{display:flex;flex-direction:column;gap:8px}

/* Responsive */
@media(max-width:640px){
  .form-row{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr 1fr}
  .stat-num{font-size:20px}
  .record-card-body{flex-direction:column;align-items:stretch}
  .record-actions{justify-content:flex-end}
  .header-sub{display:none}
  .countdown-num{font-size:26px}
}

/* Backup hint */
.backup-hint{background:var(--orange-light);border:1px solid var(--orange);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--orange);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.backup-hint svg{width:14px;height:14px;flex-shrink:0}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--gray-400)}
.loading-spinner{width:32px;height:32px;border:3px solid var(--gray-200);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div>
        <div class="header-title">自考学习台</div>
        <div class="header-sub">计算机科学与技术本科 · 广东自考</div>
      </div>
    </div>
    <div class="header-right">
      <div id="syncBadge" class="sync-badge online">
        <span class="sync-dot"></span><span id="syncText">已同步</span>
      </div>
      <button class="btn-icon" onclick="exportJSON()" title="导出JSON备份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="btn-icon" onclick="document.getElementById('importFile').click()" title="导入恢复">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>

  <!-- Countdown -->
  <div class="countdown-bar">
    <div class="countdown-left">
      <div>
        <div class="countdown-num" id="countdownNum">--</div>
        <div class="countdown-label">天</div>
      </div>
      <div>
        <div style="font-size:15px;font-weight:600">距离10月自考</div>
        <div style="font-size:12px;opacity:.8" id="examDate">预计 2026年10月</div>
      </div>
    </div>
    <div class="countdown-right">
      <div>广东自考每年1月、4月、10月</div>
      <div>下次报考关注省教育考试院</div>
    </div>
  </div>

  <!-- Today section -->
  <div class="section">
    <div class="section-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      今天要处理
      <span class="badge" id="todayBadge" style="display:none">0</span>
    </div>
    <div class="today-list" id="todayList">
      <div class="loading"><div class="loading-spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- Backup hint -->
  <div class="backup-hint" id="backupHint" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>数据已积累一定量，建议点击右上角导出JSON备份</span>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" data-sp-bindable="database" data-sp-database-id="e4nTTZAr4Wb7g5hAqymplo" id="statHours">0</div>
      <div class="stat-label">累计学习(分钟)</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" data-sp-bindable="database" data-sp-database-id="e4nTTZAr4Wb7g5hAqymplo" id="statDone">0</div>
      <div class="stat-label">已完成任务</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" data-sp-bindable="database" data-sp-database-id="e4nTTZAr4Wb7g5hAqymplo" id="statMastery">0%</div>
      <div class="stat-label">平均掌握度</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="progress" onclick="switchTab('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
      科目进度
    </button>
    <button class="tab" data-tab="checkin" onclick="switchTab('checkin')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      每日打卡
    </button>
    <button class="tab" data-tab="mistake" onclick="switchTab('mistake')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      错题本
    </button>
  </div>

  <!-- Tab: Progress -->
  <div class="tab-content active" id="tab-progress">
    <button class="btn-add" onclick="openModal('科目进度')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加科目进度
    </button>
    <div class="record-list" id="progressList">
      <div class="loading"><div class="loading-spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- Tab: Checkin -->
  <div class="tab-content" id="tab-checkin">
    <div class="checkin-stats">
      <div class="checkin-stat">
        <div class="checkin-stat-num" data-sp-bindable="database" data-sp-database-id="e4nTTZAr4Wb7g5hAqymplo" id="checkinDays">0</div>
        <div class="checkin-stat-label">打卡次数</div>
      </div>
      <div class="checkin-stat">
        <div class="checkin-stat-num" data-sp-bindable="database" data-sp-database-id="e4nTTZAr4Wb7g5hAqymplo" id="checkinTotalMin">0</div>
        <div class="checkin-stat-label">累计分钟</div>
      </div>
      <div class="checkin-stat">
        <div class="checkin-stat-num" data-sp-bindable="database" data-sp-database-id="e4nTTZAr4Wb7g5hAqymplo" id="checkinAvg">0</div>
        <div class="checkin-stat-label">平均分钟/次</div>
      </div>
    </div>
    <button class="btn-add" onclick="openModal('每日打卡')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加今日打卡
    </button>
    <div class="checkin-list" id="checkinList">
      <div class="loading"><div class="loading-spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- Tab: Mistake -->
  <div class="tab-content" id="tab-mistake">
    <button class="btn-add" onclick="openModal('错题记录')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加错题记录
    </button>
    <div class="record-list" id="mistakeList">
      <div class="loading"><div class="loading-spinner"></div>加载中...</div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">添加记录</div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <form id="recordForm" onsubmit="submitRecord(event)">
      <input type="hidden" name="type" id="modalType" value="">
      <input type="hidden" name="record_id" id="modalRecordId" value="">
      <div class="form-group">
        <label class="form-label">科目</label>
        <select class="form-select" name="subject" id="formSubject" required>
          <option value="">请选择科目</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">标题</label>
        <input class="form-input" name="title" type="text" placeholder="如：第1-3章复习" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">状态</label>
          <select class="form-select" name="status" id="formStatus" required>
            <option value="">请选择</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">优先级</label>
          <select class="form-select" name="priority" id="formPriority" required>
            <option value="">请选择</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">日期</label>
          <input class="form-input" name="date" type="date" required>
        </div>
        <div class="form-group">
          <label class="form-label">学习时长(分钟)</label>
          <input class="form-input" name="duration" type="number" min="0" value="0">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">掌握程度(0-100)</label>
        <input class="form-input" name="mastery" type="number" min="0" max="100" value="0">
      </div>
      <div class="form-group">
        <label class="form-label">内容详情</label>
        <textarea class="form-textarea" name="details" placeholder="记录学习内容、错题原因、复习要点等"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        <button type="submit" class="btn-primary" id="submitBtn">提交</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  var DATABASE_ID = 'e4nTTZAr4Wb7g5hAqymplo';
  var db = null;
  var sdkReady = false;
  var SCHEMA_OPTIONS = {};
  var ALL_RECORDS = [];
  var CACHE_PREFIX = 'wb_zikao_form_';
  var cacheTimers = {};
  var CURRENT_TAB = 'progress';

  // Init
  function init(){
    db = window.__SMART_PAGE__ && window.__SMART_PAGE__.database;
    if(!db){
      setOffline();
      loadFromLocal();
      return;
    }
    db.getSchema({databaseId: DATABASE_ID}).then(function(schema){
      (schema.properties || []).forEach(function(field){
        if((field.type === 'select' || field.type === 'multi_select') && field.config && field.config.options){
          SCHEMA_OPTIONS[field.name] = field.config.options;
        }
      });
      fillSelectOptions();
      setupFormCache();
      sdkReady = true;
      loadData();
    }).catch(function(err){
      console.error('[database] schema error:', err);
      setOffline();
      loadFromLocal();
    });
  }

  function setOffline(){
    var badge = document.getElementById('syncBadge');
    badge.className = 'sync-badge offline';
    document.getElementById('syncText').textContent = '离线模式';
  }

  function fillSelectOptions(){
    var subjSel = document.getElementById('formSubject');
    var statusSel = document.getElementById('formStatus');
    var priSel = document.getElementById('formPriority');
    if(SCHEMA_OPTIONS['科目']){
      SCHEMA_OPTIONS['科目'].forEach(function(opt){
        var el = document.createElement('option');
        el.value = opt.id; el.textContent = opt.text;
        subjSel.appendChild(el);
      });
    }
    if(SCHEMA_OPTIONS['状态']){
      SCHEMA_OPTIONS['状态'].forEach(function(opt){
        var el = document.createElement('option');
        el.value = opt.id; el.textContent = opt.text;
        statusSel.appendChild(el);
      });
    }
    if(SCHEMA_OPTIONS['优先级']){
      SCHEMA_OPTIONS['优先级'].forEach(function(opt){
        var el = document.createElement('option');
        el.value = opt.id; el.textContent = opt.text;
        priSel.appendChild(el);
      });
    }
  }

  function setupFormCache(){
    var formEl = document.getElementById('recordForm');
    if(!formEl) return;
    var fields = formEl.querySelectorAll('input[name], select[name], textarea[name]');
    fields.forEach(function(el){
      if(el.type === 'file' || el.type === 'password') return;
      var name = el.getAttribute('name');
      if(!name) return;
      if(/密码|身份证|secret|token|key/i.test(name)) return;
      var handler = function(){
        if(cacheTimers[name]) clearTimeout(cacheTimers[name]);
        cacheTimers[name] = setTimeout(function(){
          try{
            var val = el.type === 'checkbox' ? el.checked : el.value;
            localStorage.setItem(CACHE_PREFIX + name, JSON.stringify(val));
          }catch(e){}
        }, 300);
      };
      el.addEventListener('input', handler);
      el.addEventListener('change', handler);
    });
  }

  function restoreFormCache(){
    var formEl = document.getElementById('recordForm');
    if(!formEl) return;
    var fields = formEl.querySelectorAll('input[name], select[name], textarea[name]');
    fields.forEach(function(el){
      if(el.type === 'file' || el.type === 'password') return;
      var name = el.getAttribute('name');
      if(!name) return;
      if(/密码|身份证|secret|token|key/i.test(name)) return;
      try{
        var saved = localStorage.getItem(CACHE_PREFIX + name);
        if(saved !== null){
          var val = JSON.parse(saved);
          if(el.type === 'checkbox') el.checked = val;
          else el.value = val;
        }
      }catch(e){}
    });
  }

  function clearFormCache(){
    try{
      var keys = [];
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(CACHE_PREFIX) === 0) keys.push(k);
      }
      keys.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
  }

  function loadData(){
    if(!sdkReady){ return; }
    db.query({
      databaseId: DATABASE_ID,
      sorts: [{property: '日期', direction: 'descending'}],
      pageSize: 100
    }).then(function(result){
      ALL_RECORDS = result.results || [];
      renderAll();
    }).catch(function(err){
      console.error('[database] query error:', err);
      setOffline();
      loadFromLocal();
    });
  }

  function renderAll(){
    renderToday();
    renderStats();
    renderProgress();
    renderCheckin();
    renderMistake();
    renderCountdown();
    checkBackupHint();
  }

  // Get option text by id
  function optText(fieldName, val){
    if(!SCHEMA_OPTIONS[fieldName] || !val) return val || '';
    for(var i=0; i<SCHEMA_OPTIONS[fieldName].length; i++){
      if(SCHEMA_OPTIONS[fieldName][i].id === val) return SCHEMA_OPTIONS[fieldName][i].text;
    }
    return val;
  }

  // Get option id by text
  function optId(fieldName, text){
    if(!SCHEMA_OPTIONS[fieldName] || !text) return text || '';
    for(var i=0; i<SCHEMA_OPTIONS[fieldName].length; i++){
      if(SCHEMA_OPTIONS[fieldName][i].text === text) return SCHEMA_OPTIONS[fieldName][i].id;
    }
    return text;
  }

  function formatDate(d){
    if(!d) return '';
    if(typeof d === 'string') return d.substring(0,10);
    return '';
  }

  function todayStr(){
    var d = new Date();
    var m = (d.getMonth()+1); var day = d.getDate();
    return d.getFullYear() + '-' + (m<10?'0'+m:m) + '-' + (day<10?'0'+day:day);
  }

  // Render Today
  function renderToday(){
    var list = document.getElementById('todayList');
    var badge = document.getElementById('todayBadge');
    var today = todayStr();
    var items = [];
    ALL_RECORDS.forEach(function(r){
      var status = optText('状态', r['状态']);
      if(status === '已完成') return;
      var date = formatDate(r['日期']);
      if(!date) return;
      var tag = ''; var cls = '';
      if(date < today){ tag = '逾期'; cls = 'overdue'; }
      else if(date === today){ tag = '今天'; cls = 'today'; }
      else if(date <= addDays(today, 3)){ tag = '即将'; cls = 'soon'; }
      else return;
      items.push({record:r, tag:tag, cls:cls, date:date});
    });
    items.sort(function(a,b){ return a.date.localeCompare(b.date); });
    if(items.length === 0){
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><p>暂无待处理事项，继续加油！</p></div>';
      badge.style.display = 'none';
      return;
    }
    badge.style.display = 'inline-block';
    badge.textContent = items.length;
    var html = '';
    items.forEach(function(item){
      var r = item.record;
      var subj = optText('科目', r['科目']);
      var title = r['标题'] || '';
      var pri = optText('优先级', r['优先级']) || '';
      html += '<div class="today-item ' + item.cls + '">'
        + '<span class="today-item-tag ' + item.cls + '">' + item.tag + '</span>'
        + '<div class="today-item-content">'
        + '<div class="today-item-title">' + escapeHtml(title) + '</div>'
        + '<div class="today-item-sub">' + escapeHtml(subj) + ' · ' + item.date + (pri?' · '+pri:'') + '</div>'
        + '</div>'
        + '<button class="today-item-btn" onclick="quickDone(\'' + r._id + '\')">完成</button>'
        + '</div>';
    });
    list.innerHTML = html;
  }

  function addDays(dateStr, n){
    var d = new Date(dateStr);
    d.setDate(d.getDate()+n);
    var m = (d.getMonth()+1); var day = d.getDate();
    return d.getFullYear() + '-' + (m<10?'0'+m:m) + '-' + (day<10?'0'+day:day);
  }

  // Render Stats
  function renderStats(){
    var totalMin = 0; var doneCount = 0; var masterySum = 0; var masteryCount = 0;
    ALL_RECORDS.forEach(function(r){
      var dur = r['学习时长'];
      if(typeof dur === 'number') totalMin += dur;
      var status = optText('状态', r['状态']);
      if(status === '已完成') doneCount++;
      var mas = r['掌握程度'];
      if(typeof mas === 'number' && mas > 0){ masterySum += mas; masteryCount++; }
    });
    document.getElementById('statHours').textContent = totalMin;
    document.getElementById('statDone').textContent = doneCount;
    document.getElementById('statMastery').textContent = (masteryCount > 0 ? Math.round(masterySum/masteryCount) : 0) + '%';
  }

  // Render Progress
  function renderProgress(){
    var list = document.getElementById('progressList');
    var records = ALL_RECORDS.filter(function(r){ return optText('类型', r['类型']) === '科目进度'; });
    if(records.length === 0){
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg><p>暂无科目进度，点击上方添加</p></div>';
      return;
    }
    list.innerHTML = records.map(function(r){
      return renderRecordCard(r);
    }).join('');
  }

  // Render Checkin
  function renderCheckin(){
    var list = document.getElementById('checkinList');
    var records = ALL_RECORDS.filter(function(r){ return optText('类型', r['类型']) === '每日打卡'; });
    var totalMin = 0;
    records.forEach(function(r){ if(typeof r['学习时长'] === 'number') totalMin += r['学习时长']; });
    document.getElementById('checkinDays').textContent = records.length;
    document.getElementById('checkinTotalMin').textContent = totalMin;
    document.getElementById('checkinAvg').textContent = records.length > 0 ? Math.round(totalMin/records.length) : 0;
    if(records.length === 0){
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg><p>暂无打卡记录，今天开始吧！</p></div>';
      return;
    }
    list.innerHTML = records.map(function(r){
      return renderRecordCard(r, true);
    }).join('');
  }

  // Render Mistake
  function renderMistake(){
    var list = document.getElementById('mistakeList');
    var records = ALL_RECORDS.filter(function(r){ return optText('类型', r['类型']) === '错题记录'; });
    if(records.length === 0){
      list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg><p>暂无错题记录</p></div>';
      return;
    }
    list.innerHTML = records.map(function(r){
      return renderRecordCard(r);
    }).join('');
  }

  // Render single record card
  function renderRecordCard(r, isCheckin){
    var title = r['标题'] || '';
    var subj = optText('科目', r['科目']);
    var status = optText('状态', r['状态']);
    var pri = optText('优先级', r['优先级']) || '';
    var date = formatDate(r['日期']);
    var dur = r['学习时长'] || 0;
    var mas = r['掌握程度'] || 0;
    var details = r['内容详情'] || '';

    var priCls = pri === 'P0-紧急' ? 'tag-p0' : (pri === 'P1-重要' ? 'tag-p1' : 'tag-p2');
    var statusCls = status === '已完成' ? 'tag-done' : (status === '需复习' ? 'tag-review' : (status === '进行中' ? 'tag-progress' : 'tag-notstart'));

    var ringR = 18; var ringC = 2 * Math.PI * ringR;
    var offset = ringC * (1 - mas/100);

    var html = '<div class="record-card">'
      + '<div class="record-card-header">'
      + '<div class="record-card-title">' + escapeHtml(title) + '</div>'
      + '<div class="record-card-tags">'
      + (pri ? '<span class="tag ' + priCls + '">' + pri + '</span>' : '')
      + '<span class="tag ' + statusCls + '">' + status + '</span>'
      + '</div>'
      + '</div>'
      + '<div class="record-card-body">'
      + '<div class="progress-ring">'
      + '<svg width="48" height="48">'
      + '<circle class="progress-ring-bg" cx="24" cy="24" r="' + ringR + '" stroke-width="4" fill="none"/>'
      + '<circle class="progress-ring-fg" cx="24" cy="24" r="' + ringR + '" stroke-width="4" fill="none" stroke-dasharray="' + ringC + '" stroke-dashoffset="' + offset + '"/>'
      + '</svg>'
      + '<div class="progress-ring-text">' + mas + '%</div>'
      + '</div>'
      + '<div class="record-info">'
      + '<div class="record-subject">' + escapeHtml(subj) + '</div>'
      + (details ? '<div class="record-details">' + escapeHtml(details) + '</div>' : '')
      + '<div class="record-meta">'
      + '<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>' + date + '</span>'
      + '<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + dur + '分钟</span>'
      + '</div>'
      + '</div>'
      + '<div class="record-actions">'
      + '<button class="btn-small" onclick="editRecord(\'' + r._id + '\')">编辑</button>'
      + '<button class="btn-small danger" onclick="deleteRecord(\'' + r._id + '\')">删除</button>'
      + '</div>'
      + '</div>'
      + '</div>';
    return html;
  }

  // Countdown
  function renderCountdown(){
    var examDate = new Date('2026-10-25');
    var now = new Date();
    var diff = Math.ceil((examDate - now) / (1000*60*60*24));
    if(diff < 0) diff = 0;
    document.getElementById('countdownNum').textContent = diff;
  }

  // Backup hint
  function checkBackupHint(){
    if(ALL_RECORDS.length >= 30){
      document.getElementById('backupHint').style.display = 'flex';
    }
  }

  // Tab switch
  window.switchTab = function(tab){
    CURRENT_TAB = tab;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
    document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
    document.getElementById('tab-'+tab).classList.add('active');
  };

  // Modal
  window.openModal = function(type){
    document.getElementById('modalType').value = type;
    document.getElementById('modalRecordId').value = '';
    document.getElementById('modalTitle').textContent = type === '科目进度' ? '添加科目进度' : (type === '每日打卡' ? '添加今日打卡' : '添加错题记录');
    document.getElementById('recordForm').reset();
    document.getElementsByName('date')[0].value = todayStr();
    document.getElementById('formSubject').value = '';
    document.getElementById('formStatus').value = '';
    document.getElementById('formPriority').value = '';
    restoreFormCache();
    document.getElementById('modalOverlay').classList.add('show');
  };

  window.closeModal = function(){
    document.getElementById('modalOverlay').classList.remove('show');
  };

  // Submit record
  window.submitRecord = function(e){
    e.preventDefault();
    var form = e.target;
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '提交中...';

    var typeVal = document.getElementById('modalType').value;
    var recordId = document.getElementById('modalRecordId').value;

    var properties = {};
    properties['类型'] = { select: optId('类型', typeVal) };
    properties['科目'] = { select: form.querySelector('[name="subject"]').value };
    properties['标题'] = { text: form.querySelector('[name="title"]').value };
    properties['状态'] = { select: form.querySelector('[name="status"]').value };
    properties['优先级'] = { select: form.querySelector('[name="priority"]').value };
    properties['日期'] = { date: form.querySelector('[name="date"]').value };
    properties['学习时长'] = { number: parseFloat(form.querySelector('[name="duration"]').value) || 0 };
    properties['掌握程度'] = { number: parseFloat(form.querySelector('[name="mastery"]').value) || 0 };
    properties['内容详情'] = { text: form.querySelector('[name="details"]').value };

    if(recordId){
      db.updateRecord({databaseId: DATABASE_ID, recordId: recordId, properties: properties})
        .then(function(){ clearFormCache(); closeModal(); loadData(); })
        .catch(function(err){ console.error('update error:', err); alert('更新失败，请重试'); })
        .finally(function(){ btn.disabled = false; btn.textContent = '提交'; });
    } else {
      db.addRecord({databaseId: DATABASE_ID, properties: properties})
        .then(function(){ clearFormCache(); closeModal(); loadData(); })
        .catch(function(err){ console.error('add error:', err); alert('提交失败，请重试'); })
        .finally(function(){ btn.disabled = false; btn.textContent = '提交'; });
    }
  };

  // Quick done
  window.quickDone = function(recordId){
    var doneId = optId('状态', '已完成');
    db.updateRecord({databaseId: DATABASE_ID, recordId: recordId, properties: {'状态': {select: doneId}}})
      .then(function(){ loadData(); })
      .catch(function(err){ console.error('update error:', err); alert('操作失败'); });
  };

  // Edit record
  window.editRecord = function(recordId){
    var r = null;
    for(var i=0; i<ALL_RECORDS.length; i++){
      if(ALL_RECORDS[i]._id === recordId){ r = ALL_RECORDS[i]; break; }
    }
    if(!r) return;
    var typeVal = optText('类型', r['类型']);
    document.getElementById('modalType').value = typeVal;
    document.getElementById('modalRecordId').value = recordId;
    document.getElementById('modalTitle').textContent = '编辑记录';
    document.getElementById('recordForm').reset();
    form.querySelector('[name="title"]').value = r['标题'] || '';
    form.querySelector('[name="subject"]').value = r['科目'] || '';
    form.querySelector('[name="status"]').value = r['状态'] || '';
    form.querySelector('[name="priority"]').value = r['优先级'] || '';
    form.querySelector('[name="date"]').value = formatDate(r['日期']);
    form.querySelector('[name="duration"]').value = r['学习时长'] || 0;
    form.querySelector('[name="mastery"]').value = r['掌握程度'] || 0;
    form.querySelector('[name="details"]').value = r['内容详情'] || '';
    document.getElementById('modalOverlay').classList.add('show');
  };

  // Delete record
  window.deleteRecord = function(recordId){
    if(!confirm('确定删除这条记录吗？')) return;
    db.deleteRecord({databaseId: DATABASE_ID, recordId: recordId})
      .then(function(){ loadData(); })
      .catch(function(err){ console.error('delete error:', err); alert('删除失败'); });
  };

  // Export
  window.exportJSON = function(){
    var data = JSON.stringify(ALL_RECORDS, null, 2);
    var blob = new Blob([data], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '自考学习台_备份_' + todayStr() + '.json';
    a.click();
  };

  // Import
  window.importJSON = function(event){
    var file = event.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        if(!Array.isArray(data)){ alert('文件格式不正确'); return; }
        if(!confirm('将导入 ' + data.length + ' 条记录，是否继续？')) return;
        var promises = data.map(function(r){
          var properties = {};
          if(r['科目']) properties['科目'] = {select: typeof r['科目'] === 'string' ? optId('科目', r['科目']) : r['科目']};
          if(r['标题']) properties['标题'] = {text: r['标题']};
          if(r['状态']) properties['状态'] = {select: typeof r['状态'] === 'string' ? optId('状态', r['状态']) : r['状态']};
          if(r['优先级']) properties['优先级'] = {select: typeof r['优先级'] === 'string' ? optId('优先级', r['优先级']) : r['优先级']};
          if(r['日期']) properties['日期'] = {date: formatDate(r['日期'])};
          if(r['学习时长'] !== undefined) properties['学习时长'] = {number: r['学习时长']};
          if(r['掌握程度'] !== undefined) properties['掌握程度'] = {number: r['掌握程度']};
          if(r['内容详情']) properties['内容详情'] = {text: r['内容详情']};
          if(r['类型']) properties['类型'] = {select: typeof r['类型'] === 'string' ? optId('类型', r['类型']) : r['类型']};
          return db.addRecord({databaseId: DATABASE_ID, properties: properties});
        });
        Promise.all(promises).then(function(){ alert('导入成功！'); loadData(); }).catch(function(){ alert('部分导入失败'); loadData(); });
      }catch(err){ alert('解析失败：' + err.message); }
    };
    reader.readAsText(file);
    event.target.value = '';
  };

  // Local storage fallback
  function loadFromLocal(){
    var saved = localStorage.getItem('wb_zikao_records');
    ALL_RECORDS = saved ? JSON.parse(saved) : [];
    renderAll();
  }

  // Escape HTML
  function escapeHtml(s){
    if(!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Form reference
  var form = document.getElementById('recordForm');

  // Start
  init();
})();
</script>
</body>
</html>
